name: Build Unsigned Debug APK

on:
  # 推代码时自动触发；也能手动点"Run workflow"触发
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. 拉取代码
      uses: actions/checkout@v4

    - name: 2. 列出文件（诊断用）
      run: |
        echo "===== 仓库根目录文件 ====="
        ls -la
        echo "===== 查找 BandSpark.zip ====="
        find . -name "*.zip" -type f

    - name: 3. 解压 BandSpark.zip
      run: |
        # 优先找 BandSpark.zip（你手动上传的压缩包里应该包含整个项目）
        if [ -f "BandSpark.zip" ]; then
          echo "找到 BandSpark.zip，解压中..."
          unzip BandSpark.zip
        else
          echo "❌ 没找到 BandSpark.zip，请手动上传到仓库根目录"
          exit 1
        fi

    - name: 4. 设置 JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 5. 定位项目目录
      run: |
        # 解压后，gradlew 可能在根目录，也可能在 BandSpark/ 子目录里
        if [ -f "./gradlew" ]; then
          echo "PROJECT_DIR=." >> "$GITHUB_ENV"
        elif [ -d "BandSpark" ] && [ -f "BandSpark/gradlew" ]; then
          echo "PROJECT_DIR=BandSpark" >> "$GITHUB_ENV"
        elif [ -d "BandSpark" ] && [ -f "BandSpark/settings.gradle" ]; then
          # 没有 gradlew 也有 settings.gradle，可以后面自己装 wrapper
          echo "PROJECT_DIR=BandSpark" >> "$GITHUB_ENV"
        else
          echo "未找到项目目录，解压后的文件列表："
          ls -la
          exit 1
        fi
        echo "PROJECT_DIR = $PROJECT_DIR"

    - name: 6. 修复 build.gradle（proguard / minify）
      run: |
        cd ${{ env.PROJECT_DIR }}
        if [ -f "app/build.gradle" ]; then
          # Kotlin 写的 Groovy 风格，常见的是 defaultProguardFile
          sed -i "s|getDefaultProguardFile('[^']*')|getDefaultProguardFile('proguard-android-optimize.txt')|g" app/build.gradle || true
          sed -i "s|minifyEnabled true|minifyEnabled false|g" app/build.gradle || true
        fi
        if [ -f "app/build.gradle.kts" ]; then
          sed -i 's|getDefaultProguardFile("[^"]*")|getDefaultProguardFile("proguard-android-optimize.txt")|g' app/build.gradle.kts || true
          sed -i 's|isMinifyEnabled = true|isMinifyEnabled = false|g' app/build.gradle.kts || true
        fi
        echo "修复完成"

    - name: 7. 生成 Gradle Wrapper（如果没有）
      run: |
        cd ${{ env.PROJECT_DIR }}
        if [ ! -f "gradlew" ]; then
          echo "没有 gradlew，用系统 gradle 生成"
          # 装 gradle 本身需要 apt；用 sdkman 不便于 CI，用官方 curl 下载
          curl -sL https://services.gradle.org/distributions/gradle-8.4-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.4/bin/gradle wrapper --gradle-version 8.4
        fi
        chmod +x gradlew

    - name: 8. 编译 Debug APK
      run: |
        cd ${{ env.PROJECT_DIR }}
        ./gradlew assembleDebug --no-daemon --stacktrace

    - name: 9. 上传 APK 到 Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BandSpark-unsigned-debug
        path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
